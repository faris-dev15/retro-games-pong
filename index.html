<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong</title>
  <style>
    /* Page look: dark background, game centered on screen */
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      background: #000;
      border: 4px solid #eee;
      max-width: 95vw;
      height: auto;
      touch-action: none; /* stops the page scrolling while you drag on a phone */
    }
    p { margin: 12px 0 0; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <p>Move: W / S or Up / Down arrows (or drag with mouse/finger) &nbsp;|&nbsp; Space: start / pause</p>

  <script>
    // ---------- SETUP ----------
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");   // ctx is our "paintbrush"

    const WIN_SCORE = 5;       // first to this score wins
    const PADDLE_W = 12;
    const PADDLE_H = 90;
    const BALL_SIZE = 12;

    // ---------- GAME STATE (everything that changes while playing) ----------
    const player = { x: 20,                        y: 205, score: 0, speed: 6 };
    const cpu    = { x: canvas.width - 20 - PADDLE_W, y: 205, score: 0, speed: 4 };
    const ball   = { x: 400, y: 250, vx: 5, vy: 3 };

    let state = "ready";       // "ready", "playing", "paused", or "gameover"
    const keys = {};           // remembers which keys are held down

    // ---------- INPUT ----------
    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === " ") {
        e.preventDefault();
        toggleStart();
      }
      if (e.key === "ArrowUp" || e.key === "ArrowDown") e.preventDefault();
    });
    window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

    // Mouse / touch: paddle follows your pointer
    function pointerMove(clientY) {
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.height / rect.height;   // handles the canvas being resized
      player.y = (clientY - rect.top) * scale - PADDLE_H / 2;
    }
    canvas.addEventListener("mousemove", (e) => pointerMove(e.clientY));
    canvas.addEventListener("touchmove", (e) => pointerMove(e.touches[0].clientY));
    canvas.addEventListener("touchstart", () => { if (state !== "playing") toggleStart(); });

    function toggleStart() {
      if (state === "ready" || state === "paused") state = "playing";
      else if (state === "playing") state = "paused";
      else if (state === "gameover") {
        player.score = 0;
        cpu.score = 0;
        resetBall(1);
        state = "playing";
      }
    }

    // ---------- HELPERS ----------
    function resetBall(direction) {
      ball.x = canvas.width / 2 - BALL_SIZE / 2;
      ball.y = canvas.height / 2 - BALL_SIZE / 2;
      ball.vx = 5 * direction;                          // direction: 1 = right, -1 = left
      ball.vy = (Math.random() * 4 - 2) || 2;           // random up/down angle
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    // Did the ball hit this paddle?
    function hits(p) {
      return ball.x < p.x + PADDLE_W &&
             ball.x + BALL_SIZE > p.x &&
             ball.y < p.y + PADDLE_H &&
             ball.y + BALL_SIZE > p.y;
    }

    // Bounce off a paddle; hitting near the edge sends the ball at a sharper angle
    function bounce(p, direction) {
      const hitPoint = (ball.y + BALL_SIZE / 2) - (p.y + PADDLE_H / 2);  // -45 to +45
      ball.vy = hitPoint * 0.15;
      ball.vx = Math.min(Math.abs(ball.vx) + 0.5, 12) * direction;       // speeds up each hit
    }

    // ---------- UPDATE (runs every frame: moves everything) ----------
    function update() {
      if (state !== "playing") return;

      // Player paddle: keyboard
      if (keys["w"] || keys["arrowup"])   player.y -= player.speed;
      if (keys["s"] || keys["arrowdown"]) player.y += player.speed;
      player.y = clamp(player.y, 0, canvas.height - PADDLE_H);

      // CPU paddle: follows the ball, but slowly enough that you can beat it
      const cpuCenter = cpu.y + PADDLE_H / 2;
      const ballCenter = ball.y + BALL_SIZE / 2;
      if (ballCenter < cpuCenter - 10) cpu.y -= cpu.speed;
      if (ballCenter > cpuCenter + 10) cpu.y += cpu.speed;
      cpu.y = clamp(cpu.y, 0, canvas.height - PADDLE_H);

      // Move the ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Bounce off top and bottom walls
      if (ball.y <= 0 || ball.y + BALL_SIZE >= canvas.height) {
        ball.vy = -ball.vy;
        ball.y = clamp(ball.y, 0, canvas.height - BALL_SIZE);
      }

      // Bounce off paddles
      if (hits(player) && ball.vx < 0) bounce(player, 1);
      if (hits(cpu) && ball.vx > 0)    bounce(cpu, -1);

      // Scoring: ball went past a paddle
      if (ball.x + BALL_SIZE < 0) {
        cpu.score++;
        resetBall(1);
      } else if (ball.x > canvas.width) {
        player.score++;
        resetBall(-1);
      }

      // Win check
      if (player.score >= WIN_SCORE || cpu.score >= WIN_SCORE) state = "gameover";
    }

    // ---------- DRAW (runs every frame: paints everything) ----------
    function drawText(text, x, y, size) {
      ctx.fillStyle = "#eee";
      ctx.font = size + "px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText(text, x, y);
    }

    function draw() {
      // Clear screen
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dashed center line
      ctx.fillStyle = "#555";
      for (let y = 0; y < canvas.height; y += 30) {
        ctx.fillRect(canvas.width / 2 - 2, y, 4, 16);
      }

      // Paddles and ball
      ctx.fillStyle = "#eee";
      ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(cpu.x, cpu.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

      // Scores
      drawText(player.score, canvas.width / 2 - 60, 60, 48);
      drawText(cpu.score,    canvas.width / 2 + 60, 60, 48);

      // Messages
      if (state === "ready")  drawText("Press SPACE to start", canvas.width / 2, 300, 28);
      if (state === "paused") drawText("PAUSED - press SPACE", canvas.width / 2, 300, 28);
      if (state === "gameover") {
        const msg = player.score > cpu.score ? "YOU WIN!" : "CPU WINS";
        drawText(msg, canvas.width / 2, 260, 48);
        drawText("Press SPACE to play again", canvas.width / 2, 310, 24);
      }
    }

    // ---------- GAME LOOP (repeats ~60 times per second) ----------
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
